<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="canvas" content="1080x1350" />
    <title>Founding Pass, 1 of 4</title>
    <link rel="stylesheet" href="instagram.css" />
    <style>
      /* All 1,000 designs, in number order, from the website's laced art (generated, never edited). */
      .flood {
        position: absolute;
        inset: 0;
        display: grid;
        grid-template-columns: repeat(25, 1fr);
        grid-template-rows: repeat(40, 1fr);
        align-items: center;
        justify-items: center;
      }
      .flood img {
        width: 38px;
        height: auto;
      }
      .box {
        position: relative;
        background: var(--off-white);
        border-radius: 10px;
      }
      .headline {
        padding: 44px 48px 48px;
      }
      .headline h1 {
        margin-top: 48px;
      }
      .headline .lede {
        margin-top: 24px;
      }
      .bottom {
        margin-top: auto;
        padding: 24px 32px;
      }
    </style>
  </head>
  <body class="post">
    <div class="flood"></div>

    <div class="box headline">
      <div class="meta-row">
        <span class="meta">StrideMon • Founding Pass</span>
        <span class="mono meta">01 / 04</span>
      </div>
      <h1>1,000 Founding<br />Passes.</h1>
      <p class="lede">Each design exists once. Free to mint on Monad testnet.</p>
    </div>

    <div class="box bottom meta-row">
      <span class="meta">1,000 designs • 1 of 1</span>
      <span class="mono meta">Swipe →</span>
    </div>

    <script>
      const flood = document.querySelector('.flood')
      for (let designNumber = 1; designNumber <= 1000; designNumber++) {
        const image = document.createElement('img')
        image.src = `../../../website/public/pass-art/laced/${String(designNumber).padStart(4, '0')}.svg`
        flood.append(image)
      }
    </script>
  </body>
</html>
