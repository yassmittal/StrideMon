<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="canvas" content="1080x1350" />
    <title>How a run works, 4 of 5</title>
    <link rel="stylesheet" href="instagram.css" />
    <style>
      /* The recorded walk's summary and its SessionSettled event (launch-video/FACTS.md §3, §4). */
      .panel {
        margin-top: auto;
        padding: 44px 48px 44px;
      }
      .reward {
        font-size: 150px;
        line-height: 1;
        letter-spacing: -0.03em;
        margin-top: 36px;
      }
      .reward-unit {
        margin-left: 22px;
        font-size: 56px;
        letter-spacing: 0;
      }
      .stats {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        column-gap: 24px;
        margin-top: 44px;
        padding-top: 30px;
        border-top: 1px solid var(--line-on-dark);
      }
      .stats .value {
        font-size: 34px;
        margin-top: 10px;
      }
    </style>
  </head>
  <body class="post">
    <span class="cross top-left"></span>
    <span class="cross top-right"></span>
    <span class="cross bottom-left"></span>
    <span class="cross bottom-right"></span>

    <div class="meta-row">
      <span class="meta">Step 3</span>
      <span class="mono meta">04 / 05</span>
    </div>

    <h1 class="medium">It settles<br />on Monad.</h1>
    <p class="lede">The contract pays STRIDE into your wallet, and the Sneaker loses a little durability.</p>

    <section class="panel">
      <span class="meta">You earned • Run settled</span>
      <p class="mono reward lime">+10<span class="reward-unit">STRIDE</span></p>
      <div class="stats">
        <div>
          <span class="meta">Walk</span>
          <p class="mono value">3:05</p>
        </div>
        <div>
          <span class="meta">Rewarded</span>
          <p class="mono value">2 min</p>
        </div>
        <div>
          <span class="meta">Durability</span>
          <p class="mono value">−1</p>
        </div>
      </div>
    </section>

    <div class="meta-row footer">
      <span class="disclaimer">Monad testnet. STRIDE has no monetary value.</span>
      <span class="mono meta">stridemon.xyz</span>
    </div>
  </body>
</html>
