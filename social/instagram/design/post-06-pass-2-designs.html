<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="canvas" content="1080x1350" />
    <title>Founding Pass, 2 of 4</title>
    <link rel="stylesheet" href="instagram.css" />
    <style>
      /* Four unminted designs, one per rarity (GET /v1/pass/collection, 2026-10-16: only #0137 is
         minted). The shoe is cropped from each gallery card; the labels repeat the card's own text. */
      .designs {
        margin-top: auto;
        display: grid;
        grid-template-columns: 1fr 1fr;
        column-gap: 24px;
        row-gap: 36px;
      }
      .shoe svg {
        display: block;
        width: 100%;
        height: auto;
      }
      .label {
        margin-top: 10px;
        padding-top: 16px;
        border-top: 1px solid var(--line-on-light);
      }
      .label .top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        min-height: 30px;
        color: var(--muted-on-light);
      }
      .label .number {
        font-size: 20px;
        color: var(--black);
      }
      .label .name {
        margin-top: 8px;
        font-size: 28px;
      }
      .legendary {
        background: var(--black);
        color: var(--lime);
        border-radius: 999px;
        padding: 6px 12px 5px;
      }
      .rarity {
        font-size: 16px;
      }
    </style>
  </head>
  <body class="post">
    <span class="cross top-left"></span>
    <span class="cross top-right"></span>
    <span class="cross bottom-left"></span>
    <span class="cross bottom-right"></span>

    <div class="meta-row">
      <span class="meta">Founding Pass</span>
      <span class="mono meta">02 / 04</span>
    </div>

    <h1 class="medium">No two alike.</h1>
    <p class="lede">10 shoe shapes and 14 colour families. 650 Common, 250 Uncommon, 90 Rare and 10 Legendary.</p>

    <div class="designs">
      <figure>
        <div class="shoe art" data-svg="../../../website/public/pass-art/cards/0627.svg" data-view-box="50 200 900 520"></div>
        <figcaption class="label">
          <div class="top"><span class="mono number">#0627</span><span class="meta rarity">Common</span></div>
          <p class="name">Lime Runner Day</p>
        </figcaption>
      </figure>
      <figure>
        <div class="shoe art" data-svg="../../../website/public/pass-art/cards/0749.svg" data-view-box="50 200 900 520"></div>
        <figcaption class="label">
          <div class="top"><span class="mono number">#0749</span><span class="meta rarity">Uncommon</span></div>
          <p class="name">Rose Sock Day</p>
        </figcaption>
      </figure>
      <figure>
        <div class="shoe art" data-svg="../../../website/public/pass-art/cards/0888.svg" data-view-box="50 200 900 520"></div>
        <figcaption class="label">
          <div class="top"><span class="mono number">#0888</span><span class="meta rarity">Rare</span></div>
          <p class="name">Clay Spike Frost</p>
        </figcaption>
      </figure>
      <figure>
        <div class="shoe art" data-svg="../../../website/public/pass-art/cards/0298.svg" data-view-box="50 200 900 520"></div>
        <figcaption class="label">
          <div class="top"><span class="mono number">#0298</span><span class="meta rarity legendary">Legendary</span></div>
          <p class="name">Fogbow</p>
        </figcaption>
      </figure>
    </div>

    <div class="meta-row footer">
      <span class="meta">Drawn on-chain by the contract</span>
      <span class="mono meta">stridemon.xyz/pass</span>
    </div>

    <script src="inline-svg.js"></script>
  </body>
</html>
