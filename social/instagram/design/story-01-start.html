<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="canvas" content="1080x1920" />
    <title>Story: start</title>
    <link rel="stylesheet" href="instagram.css" />
    <style>
      .bottom {
        margin-top: auto;
        display: grid;
        grid-template-columns: 1fr 560px;
        column-gap: 40px;
        align-items: end;
      }
      .bottom .lede {
        margin-top: 0;
        padding-bottom: 8px;
      }
      .art {
        border-radius: 10px;
        overflow: hidden;
      }
    </style>
  </head>
  <body class="story dark">
    <div class="meta-row">
      <span class="meta">StrideMon</span>
      <span class="meta">Monad testnet</span>
    </div>

    <h1 class="large">Walk.<br />Earn.<br />Upgrade.</h1>
    <div class="bottom">
      <p class="lede">A walking game. Your Sneaker is an NFT: walk with it to earn STRIDE, and spend STRIDE to level it up.</p>
      <!-- The live renderer's own drawing of Sneaker #2 (the website's copy). -->
      <div class="art" data-svg="../../../website/public/sneaker-art/sneaker-0002-level-02.svg"></div>
    </div>

    <div class="meta-row footer">
      <span class="meta">Android demo</span>
      <span class="mono meta">stridemon.xyz</span>
    </div>

    <script src="inline-svg.js"></script>
  </body>
</html>
